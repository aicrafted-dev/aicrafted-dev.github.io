<!DOCTYPE html>

<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description | escape }}">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
<div class="container header-inner">
<a class="site-title" href="{{ '/' | relative_url }}">
{{ site.title | escape }}
</a>

 <nav>
<a href="{{ '/' | relative_url }}">首页</a>

<div class="nav-dropdown">
<a href="{{ '/columns/' | relative_url }}" class="dropdown-toggle">专栏 ▾</a>
<div class="dropdown-menu">
<a href="{{ '/columns/practice/' | relative_url }}">实践</a>
<a href="{{ '/columns/reading/' | relative_url }}">阅读</a>
<a href="{{ '/columns/reflections/' | relative_url }}">感悟</a>
</div>
</div>

<a href="{{ '/about.html' | relative_url }}">关于</a>

</nav>

</header>

<main class="container main-content">
{{ content }}
</main>

<footer class="site-footer">
<div class="container">
<p>{{ site.description | escape }}</p>
<p>© {{ site.time | date: "%Y" }} {{ site.title | escape }}</p>
</div>
</footer>
</body>
</html>
